# bess-site.conf — 储能英语实战 iOS PWA (纯静态)
# 部署: cp 到 /etc/nginx/conf.d/bess-site.conf (替换域名) 后 nginx -t && nginx -s reload
# 证书: 腾讯云 SSL 或 Let's Encrypt, 放置于 /etc/nginx/ssl/bess.example.com/
# 注意: nginx add_header 不跨块继承 —— 安全头统一由
#       bess-security-headers.conf 片段在各 server/location 内 include 复用。
#
# ⚠️ 不要对 PWA 使用全站 HTTP Basic Auth!
#   iPhone Safari 把 PWA 装到主屏幕后, 从桌面图标打开(standalone 模式)时
#   不共享浏览器的 Basic Auth 凭据, 导航请求会被 Nginx 返回 401, 导致
#   "Authorization required" 报错、应用打不开。Basic Auth 与 PWA 天然不兼容。
#   如需访问控制, 请改用以下 PWA 友好的方式之一:
#     1. CDN URL 鉴权 (腾讯云 CDN TypeA/TypeB, 在边缘签名, 对浏览器透明)
#     2. IP 白名单 (allow/deny, 适合内部测试)
#     3. 仅靠内容 SHA 版本化 + 隐藏域名 (语料本身是 SHA 校验的, 被爬无害)
#   gen-htpasswd.sh 脚本保留备选, 但不要用 auth_basic 保护 PWA 资源。

server {
    listen 80;
    listen [::]:80;
    server_name bess.example.com;
    return 301 https://$host$request_uri;
}

server {
    # listen 443 ssl http2; 兼容 nginx >= 1.20 全版本(Ubuntu 1.24 不支持独立 http2 on;)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bess.example.com;

    ssl_certificate     /etc/nginx/ssl/bess.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bess.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/bess/current/dist;
    index index.html;

    # ---------- 安全响应头 (server 级, 无子块 add_header 时生效) ----------
    include /etc/nginx/conf.d/bess-security-headers.conf;

    # ---------- 访问控制 (PWA 友好) ----------
    # 已移除全站 auth_basic: 它会让从主屏幕打开的 PWA 因不携带凭据而 401。
    # 如需访问控制, 参见文件顶部说明 (CDN URL 鉴权 / IP 白名单)。
    # auth_basic           "BESS Restricted";
    # auth_basic_user_file /etc/nginx/bess.htpasswd;

    # ---------- 不缓存: 应用壳与索引文件 (每个 location 重复 include 安全头) ----------
    location = /index.html {
        include /etc/nginx/conf.d/bess-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /sw.js {
        include /etc/nginx/conf.d/bess-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/bess-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /content/catalog.json {
        include /etc/nginx/conf.d/bess-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---------- 长期缓存: 带 hash 的静态资源与 SHA 版本化语料 ----------
    location /assets/ {
        include /etc/nginx/conf.d/bess-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /content/ {
        include /etc/nginx/conf.d/bess-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /icons/ {
        include /etc/nginx/conf.d/bess-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
